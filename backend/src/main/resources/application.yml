spring:
  application:
    name: sai-vandan-crm-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:sai_vandan_crm;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${DB_USERNAME:saivandan}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:/db/migration-h2/
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1
app:
  jwt:
    secret: ${JWT_SECRET:development-only-secret-change-this-to-at-least-32-bytes}
    access-token-minutes: 30
    refresh-token-days: 14
  cors:
    allowed-origins: ${FRONTEND_URLS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
