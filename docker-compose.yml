services:
  postgres:
    image: postgres:16-alpine
    container_name: sai-vandan-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sai_vandan_crm}
      POSTGRES_USER: ${POSTGRES_USER:-sai_vandan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sai_vandan_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sai_vandan -d sai_vandan_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: sai-vandan-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/sai_vandan_crm}
      DB_USERNAME: ${DB_USERNAME:-sai_vandan}
      DB_PASSWORD: ${DB_PASSWORD:-sai_vandan_dev}
      JWT_SECRET: ${JWT_SECRET:-change-this-production-secret-to-a-long-random-value}
      FRONTEND_URLS: ${FRONTEND_URLS:-http://localhost:5173,http://localhost}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5173}
      INVITATION_EXPIRY_HOURS: ${INVITATION_EXPIRY_HOURS:-24}
      INVITATION_EXPOSE_LINK: ${INVITATION_EXPOSE_LINK:-false}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      ACCOUNT_LOCK_MINUTES: ${ACCOUNT_LOCK_MINUTES:-15}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@your-domain.example}
      MAIL_AUTH_ENABLED: ${MAIL_AUTH_ENABLED:-true}
      MAIL_TLS_ENABLED: ${MAIL_TLS_ENABLED:-true}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api/v1
    container_name: sai-vandan-web
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
